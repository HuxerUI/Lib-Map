name: Build
on:
  push:
  pull_request:
jobs:
  model:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DHUXERUI_MAP_BUILD_VIEW=OFF -DHUXERUI_MAP_BUILD_TESTS=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HuxerUI/HuxerUI
          ref: cadb1696cfa7b87d9d2d316b3ecba07b85a46962
          path: .cache/HuxerUI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile native SDK Java adapters and package AAR
        working-directory: platform/android
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.cache/HuxerUI
        run: bash ./gradlew assembleDebug --console=plain
